<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Folio — a quiet home for your documents</title>
  <meta name="description" content="A private document library that lives in your browser. Keep PDFs, images, notes, and more in one place — no account, no upload." />
  <meta name="theme-color" content="#EDEEE6" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..900&family=Schibsted+Grotesk:wght@400..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%239A641F'/%3E%3Cpath d='M10 8h9l4 4v12H10z' fill='%23FFF9EC'/%3E%3Cpath d='M19 8v4h4' fill='%23D9B27A'/%3E%3C/svg%3E" />
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('folio:settings') || '{}');
      document.documentElement.dataset.theme = s.theme === 'dark' ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body>

  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.2"/><rect x="13" y="4" width="7" height="7" rx="1.2"/><rect x="4" y="13" width="7" height="7" rx="1.2"/><rect x="13" y="13" width="7" height="7" rx="1.2"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="18" r="1.2"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 20h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V5h5v2M6.5 7l.9 12.2a1 1 0 0 0 1 .8h7.2a1 1 0 0 0 1-.8L17.5 7M10 11v5M14 11v5"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17v3zM14.5 5.5l3 3"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.6l2 2.5h7.4a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5M7.5 9.5L12 5l4.5 4.5M4 20h16"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M13 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9z"/><path d="M13 3v6h6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/></symbol>
  </svg>

  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Library navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3H7.5A1.5 1.5 0 0 0 6 4.5v15A1.5 1.5 0 0 0 7.5 21h9a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M13 3v5h5"/></svg>
        </span>
        <span class="brand-name">Folio</span>
      </div>

      <button class="btn btn-primary btn-block" id="addBtn">
        <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span>Add files</span>
      </button>

      <nav class="nav" aria-label="Library views">
        <p class="nav-label">Library</p>
        <button class="nav-item" data-view="all">
          <span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-file"/></svg></span>
          <span class="nav-text">All documents</span>
          <span class="nav-count" data-count="all">0</span>
        </button>
        <button class="nav-item" data-view="recent">
          <span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg></span>
          <span class="nav-text">Recently added</span>
          <span class="nav-count" data-count="recent">0</span>
        </button>
        <button class="nav-item" data-view="favorites">
          <span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-star"/></svg></span>
          <span class="nav-text">Favorites</span>
          <span class="nav-count" data-count="favorites">0</span>
        </button>
      </nav>

      <div class="collections">
        <div class="nav-label-row">
          <p class="nav-label">Collections</p>
          <button class="icon-btn icon-btn-sm" id="newCollectionBtn" aria-label="New collection" title="New collection">
            <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>
          </button>
        </div>
        <ul class="collection-list" id="collectionList"></ul>
      </div>

      <div class="sidebar-foot">
        <div class="storage">
          <div class="storage-head"><span>Browser storage</span><span id="storageText">—</span></div>
          <div class="meter" role="presentation"><span id="storageBar"></span></div>
          <p class="storage-note">
            <svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>
            Files stay on this device
          </p>
        </div>
      </div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation">
          <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
        </button>

        <div class="search" id="searchWrap">
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="search" type="search" placeholder="Search documents" autocomplete="off" aria-label="Search documents" />
          <kbd>/</kbd>
          <button class="search-clear" id="searchClear" hidden aria-label="Clear search">
            <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
          </button>
        </div>

        <div class="topbar-actions">
          <button class="icon-btn" id="themeBtn" aria-label="Switch theme" title="Switch theme">
            <span id="themeIcon" style="display:grid;place-items:center"></span>
          </button>
          <div class="segmented" role="group" aria-label="Layout">
            <button class="seg is-active" data-layout="grid" aria-label="Grid view" aria-pressed="true">
              <svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg>
            </button>
            <button class="seg" data-layout="list" aria-label="List view" aria-pressed="false">
              <svg class="icon" aria-hidden="true"><use href="#i-list"/></svg>
            </button>
          </div>
          <button class="btn btn-primary" id="addBtnTop" aria-label="Add files">
            <svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span class="btn-label">Add files</span>
          </button>
        </div>
      </header>

      <section class="content">
        <div class="content-head">
          <div class="head-text">
            <h1 id="viewTitle">All documents</h1>
            <p class="head-meta" id="viewMeta" aria-live="polite">No documents yet</p>
          </div>
          <div class="head-tools">
            <label class="select-wrap">
              <span class="visually-hidden">Filter by type</span>
              <select id="typeSelect">
                <option value="all">All types</option>
                <option value="pdf">PDFs</option>
                <option value="image">Images</option>
                <option value="text">Text &amp; code</option>
                <option value="doc">Documents</option>
                <option value="sheet">Spreadsheets</option>
                <option value="slides">Presentations</option>
                <option value="ebook">E-books</option>
                <option value="audio">Audio</option>
                <option value="video">Video</option>
                <option value="archive">Archives</option>
                <option value="other">Other</option>
              </select>
              <svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg>
            </label>
            <label class="select-wrap">
              <span class="visually-hidden">Sort by</span>
              <select id="sortSelect">
                <option value="recent">Recently added</option>
                <option value="title">Title A–Z</option>
                <option value="size">Largest first</option>
                <option value="pages">Most pages</option>
              </select>
              <svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg>
            </label>
          </div>
        </div>

        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" hidden></div>
      </section>
    </main>
  </div>

  <div class="drop-overlay" id="dropOverlay" hidden>
    <div class="drop-frame">
      <svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg>
      <p class="drop-title">Drop to add</p>
      <p class="drop-sub">Any file type</p>
    </div>
  </div>

  <div class="reader" id="reader" hidden role="dialog" aria-modal="true" aria-labelledby="readerTitle">
    <div class="reader-panel">
      <header class="reader-head">
        <div class="reader-info">
          <h2 id="readerTitle">Document</h2>
          <p id="readerMeta"></p>
        </div>
        <div class="reader-actions">
          <button class="icon-btn" id="readerStar" aria-label="Favorite" title="Favorite">
            <svg class="icon" aria-hidden="true"><use href="#i-star"/></svg>
          </button>
          <button class="icon-btn" id="readerDownload" aria-label="Download" title="Download">
            <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>
          </button>
          <a class="icon-btn" id="readerNewTab" href="#" target="_blank" rel="noopener" aria-label="Open in new tab" title="Open in new tab">
            <svg class="icon" aria-hidden="true"><use href="#i-external"/></svg>
          </a>
          <button class="icon-btn" id="readerClose" aria-label="Close reader" title="Close">
            <svg class="icon" aria-hidden="true"><use href="#i-x"/></svg>
          </button>
        </div>
      </header>
      <div class="reader-body">
        <iframe id="readerFrame" title="Document preview"></iframe>
        <div class="reader-alt" id="readerAlt" hidden></div>
      </div>
    </div>
  </div>

  <div class="menu" id="menu" hidden role="menu"></div>

  <dialog class="dialog" id="nameDialog">
    <form id="nameForm" novalidate>
      <h2 id="nameTitle">New collection</h2>
      <p class="dialog-help" id="nameHelp" hidden></p>
      <label class="field">
        <span class="field-label">Name</span>
        <input id="nameInput" type="text" maxlength="48" autocomplete="off" />
      </label>
      <div class="swatches" id="colorRow" hidden>
        <span class="field-label">Color</span>
        <div class="swatch-row" id="swatchRow"></div>
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" id="nameCancel">Cancel</button>
        <button type="submit" class="btn btn-primary" id="nameConfirm">Create</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog" id="confirmDialog">
    <h2 id="confirmTitle">Delete document?</h2>
    <p class="dialog-body" id="confirmBody"></p>
    <div class="dialog-actions">
      <button type="button" class="btn btn-ghost" id="confirmCancel">Cancel</button>
      <button type="button" class="btn btn-danger" id="confirmOk">Delete</button>
    </div>
  </dialog>

  <dialog class="dialog" id="moveDialog">
    <h2>Move to collection</h2>
    <p class="dialog-help">Choose where this document belongs.</p>
    <div class="move-list" id="moveList"></div>
    <div class="dialog-actions">
      <button type="button" class="btn btn-ghost" id="moveCancel">Cancel</button>
    </div>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <input type="file" id="fileInput" multiple hidden />
  <script src="app.js"></script>
</body>
</html>
